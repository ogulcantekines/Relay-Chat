name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  api-test:
    name: API smoke test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Run API smoke test
        run: node scripts/smoke-test.js
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci_test
          JWT_SECRET: ci_test_secret_not_used_in_production
          PORT: 5000

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mern-chatapp:ci .

      - name: Run the stack and verify it serves traffic
        run: |
          docker network create ci-net
          docker run -d --name ci-mongo --network ci-net mongo:7
          docker run -d --name ci-app --network ci-net -p 5000:5000             -e NODE_ENV=production             -e JWT_SECRET=ci_test_secret             -e MONGO_URI=mongodb://ci-mongo:27017/ci             mern-chatapp:ci

          # Konteynerin sağlıklı hale gelmesini bekle
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/health > /dev/null; then
              echo "App is healthy"
              curl -fs http://localhost:5000/ > /dev/null && echo "Frontend is served"
              exit 0
            fi
            sleep 2
          done

          echo "App did not become healthy"
          docker logs ci-app
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs ci-app || true
