name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked dependencies
        run: npm run install:all

      - name: Check backend and test syntax
        run: find backend scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

      - name: Create ephemeral test credentials
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          mkdir -p test-results

      - name: Run API smoke test
        run: npm test 2>&1 | tee test-results/api.log
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci_api
          PORT: 5000

      - name: Run authenticated real-time tests
        run: npm run test:realtime 2>&1 | tee test-results/realtime.log
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci_realtime
          PORT: 5001

      - name: Run security regression tests
        run: npm run test:security 2>&1 | tee test-results/security.log
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci_security
          PORT: 5003

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:ui 2>&1 | tee test-results/ui.log
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci_ui
          NODE_ENV: production
          PORT: 5002
          CLIENT_URL: http://127.0.0.1:5002

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Container build, smoke test and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_IMAGE: mern-chatapp:ci
      APP_PORT: 5000
      CLIENT_URL: http://localhost:5000
      COMPOSE_PROJECT_NAME: chatapp-ci

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create ephemeral container credentials
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      - name: Validate local and optional production configuration
        run: |
          docker compose config --quiet
          CLIENT_URL=https://chat.example.com docker compose -f docker-compose.yml -f deploy/compose.production.yml config --quiet

      - name: Build and start the documented Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Verify readiness, frontend and container restrictions
        run: |
          curl --fail --silent http://localhost:5000/api/ready
          curl --fail --silent http://localhost:5000/ | grep -q '<div id="root">'
          test "$(docker compose exec -T app id -u)" != 0
          test "$(docker inspect "$(docker compose ps -q app)" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test -z "$(docker compose port mongo 27017 2>/dev/null || true)"

      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mern-chatapp:ci
          version: v0.74.0
          scanners: vuln
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > container.log 2>&1

      - name: Save container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-results
          path: |
            container.log
            trivy-report.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans